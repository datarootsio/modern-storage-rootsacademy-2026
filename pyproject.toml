[project]
name = "northtrail-lakehouse-workshop"
version = "1.0.0"
description = "Hands-on workshop on lakehouse storage architectures, using local PySpark + Delta against ADLS Gen2"
readme = "README.md"
requires-python = ">=3.11,<3.12"

# These versions were verified together against a live ADLS Gen2 account and move
# as a set -- see .devcontainer/Dockerfile and the delta-adls-conventions skill.
#
# Not listed here, because they are not Python packages: Java 17 (Spark runs in a
# JVM, not in Python) and the hadoop-azure JAR that provides the abfss:// driver
# (resolved from Maven by Ivy at session start). Both are handled in the Dockerfile.
dependencies = [
    "pyspark==4.0.1",     # bundles the Hadoop 3.4.1 client jars
    "delta-spark==4.0.1", # the release paired with Spark 4.0
    "duckdb==1.1.3",      # Exercise 1 only -- no Spark at that point
    "python-dotenv==1.0.1",
    "jupyter==1.1.1",
    "notebook==7.3.2",
]

[dependency-groups]
# Not used by anything in the workshop. Kept only so this file stays in step with
# uv.lock -- the container builds with `uv sync --frozen`, which fails if the two
# disagree. The build passes --no-dev, so it is never installed.
dev = ["pyarrow==18.1.0"]

[tool.uv]
# Install dependencies only, never the project itself. A self-install would be
# editable against the image's build-time path, which the devcontainer's bind
# mount then shadows at runtime. exercises/_shared reaches notebooks via
# PYTHONPATH instead (set in .devcontainer/devcontainer.json).
package = false
